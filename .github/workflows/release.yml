name: Release

# Triggers on a tag like `v0.1.0`. Builds the SPA once, then compiles the
# Wails desktop binary on a NATIVE runner per platform (Wails needs CGO +
# the platform webview toolchain — it can't be cross-compiled from Linux),
# packages each with README/LICENSE, and attaches them to a GitHub release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # softprops/action-gh-release creates the release

jobs:
  build-frontend:
    name: Build SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: npm install + build
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      # The Go binary embeds frontend/dist via //go:embed, so every build job
      # pulls this artifact instead of rebuilding the SPA three times.
      - name: Upload dist/ for the binary builds
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    needs: build-frontend
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runs-on: ubuntu-latest
            archive: tar.gz
            ldflags: '-s -w'
          - name: windows-amd64
            runs-on: windows-latest
            archive: zip
            ext: .exe
            # -H windowsgui hides the console window behind the app.
            ldflags: '-s -w -H windowsgui'
          - name: macos-arm64
            runs-on: macos-14 # Apple Silicon runner → native darwin/arm64
            archive: tar.gz
            ldflags: '-s -w'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Pull the SPA build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      # Wails v3 on Linux builds against GTK4 + WebKitGTK 6.0.
      - name: Install Linux build deps
        if: matrix.name == 'linux-amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: '1' # required by Wails
        run: |
          out="steelpage-desktop${{ matrix.ext }}"
          go build -trimpath -ldflags="${{ matrix.ldflags }}" -o "$out" ./cmd/steelpage-desktop
          ls -lh "$out"

      - name: Package (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          asset="steelpage-desktop-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz"
          tar czf "$asset" steelpage-desktop LICENSE.md README.md
          if command -v sha256sum >/dev/null; then sha256sum "$asset"; else shasum -a 256 "$asset"; fi > "$asset.sha256"
          cat "$asset.sha256"

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $asset = "steelpage-desktop-$env:GITHUB_REF_NAME-${{ matrix.name }}.zip"
          Compress-Archive -Path steelpage-desktop.exe,LICENSE.md,README.md -DestinationPath $asset
          (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower() + "  $asset" | Out-File -Encoding ascii "$asset.sha256"
          Get-Content "$asset.sha256"

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          # First matrix job creates the release; the rest append. Prerelease
          # auto-flips for tags like v1.0.0-rc.1 / v1.0.0-beta.
          files: |
            steelpage-desktop-${{ github.ref_name }}-${{ matrix.name }}.*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
