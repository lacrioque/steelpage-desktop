name: Release

# Triggers on a tag like `v0.1.0`. Builds the SPA once, then on a NATIVE
# runner per platform compiles the Wails binary (CGO) and packages it both
# as a raw archive (guaranteed-working fallback) and as an OS installer:
#   linux   → .AppImage (linuxdeploy)
#   macos   → Steelpage.app inside a .dmg (ad-hoc signed; unsigned/un-notarized)
#   windows → NSIS Setup .exe
# Everything is attached to the tag's GitHub release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # softprops/action-gh-release creates the release

jobs:
  build-frontend:
    name: Build SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: npm install + build
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      # The Go binary embeds frontend/dist via //go:embed, so every build job
      # pulls this artifact instead of rebuilding the SPA three times.
      - name: Upload dist/ for the binary builds
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    needs: build-frontend
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runs-on: ubuntu-latest
            archive: tar.gz
            ldflags: '-s -w'
          - name: windows-amd64
            runs-on: windows-latest
            archive: zip
            ext: .exe
            ldflags: '-s -w -H windowsgui' # hide the console window
          - name: macos-arm64
            runs-on: macos-14 # Apple Silicon → native darwin/arm64
            archive: tar.gz
            ldflags: '-s -w'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Pull the SPA build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      # Wails v3 on Linux builds against GTK4 + WebKitGTK 6.0; linuxdeploy
      # needs `file`.
      - name: Install Linux deps
        if: matrix.name == 'linux-amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev file desktop-file-utils

      - name: Build binary
        shell: bash
        env:
          CGO_ENABLED: '1' # required by Wails
        run: |
          out="steelpage-desktop${{ matrix.ext }}"
          go build -trimpath -ldflags="${{ matrix.ldflags }}" -o "$out" ./cmd/steelpage-desktop
          ls -lh "$out"

      # --- raw archive (always produced; works even if an installer step is flaky) ---
      - name: Raw archive (unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          asset="steelpage-desktop-${GITHUB_REF_NAME}-${{ matrix.name }}.tar.gz"
          tar czf "$asset" steelpage-desktop LICENSE.md README.md
          if command -v sha256sum >/dev/null; then sha256sum "$asset"; else shasum -a 256 "$asset"; fi > "$asset.sha256"

      - name: Raw archive (windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $asset = "steelpage-desktop-$env:GITHUB_REF_NAME-${{ matrix.name }}.zip"
          Compress-Archive -Path steelpage-desktop.exe,LICENSE.md,README.md -DestinationPath $asset
          (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower() + "  $asset" | Out-File -Encoding ascii "$asset.sha256"

      # --- installers ---
      - name: Package AppImage (linux)
        if: matrix.name == 'linux-amd64'
        shell: bash
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1' # run the tools without host FUSE
          DEPLOY_GTK_VERSION: '4'
        run: |
          set -euxo pipefail
          appdir=AppDir
          mkdir -p "$appdir"
          # icon basename must match the .desktop Icon= key (steelpage-desktop)
          cp build/appicon.png steelpage-desktop.png

          base=https://github.com/linuxdeploy
          wget -q "$base/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q "$base/linuxdeploy-plugin-gtk/releases/download/continuous/linuxdeploy-plugin-gtk.sh"
          wget -q "$base/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage"
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh linuxdeploy-plugin-appimage-x86_64.AppImage
          export PATH="$PWD:$PATH"

          export OUTPUT="steelpage-desktop-${GITHUB_REF_NAME}-linux-amd64.AppImage"
          ./linuxdeploy-x86_64.AppImage \
            --appdir "$appdir" \
            --executable ./steelpage-desktop \
            --desktop-file build/linux/steelpage-desktop.desktop \
            --icon-file steelpage-desktop.png \
            --plugin gtk \
            --output appimage
          sha256sum "$OUTPUT" > "$OUTPUT.sha256"
          ls -lh "$OUTPUT"

      - name: Package .deb + .rpm (linux)
        if: matrix.name == 'linux-amd64'
        shell: bash
        run: |
          set -euxo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
          export PATH="$(go env GOPATH)/bin:$PATH"
          export VERSION="${GITHUB_REF_NAME#v}"
          deb="steelpage-desktop-${GITHUB_REF_NAME}-linux-amd64.deb"
          rpm="steelpage-desktop-${GITHUB_REF_NAME}-linux-amd64.rpm"
          nfpm package -f build/linux/nfpm.yaml -p deb -t "$deb"
          nfpm package -f build/linux/nfpm.yaml -p rpm -t "$rpm"
          sha256sum "$deb" > "$deb.sha256"
          sha256sum "$rpm" > "$rpm.sha256"
          ls -lh "$deb" "$rpm"

      - name: Package .app + .dmg (macos)
        if: matrix.name == 'macos-arm64'
        shell: bash
        run: |
          set -euxo pipefail
          version="${GITHUB_REF_NAME#v}"
          app="Steelpage.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp steelpage-desktop "$app/Contents/MacOS/"
          chmod +x "$app/Contents/MacOS/steelpage-desktop"
          sed "s/__VERSION__/${version}/g" build/macos/Info.plist > "$app/Contents/Info.plist"

          # Build the .icns from the source PNG.
          iconset=icon.iconset
          mkdir -p "$iconset"
          for s in 16 32 128 256 512; do
            sips -z $s $s build/appicon.png --out "$iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d build/appicon.png --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/icon.icns"

          # arm64 binaries must be signed (even ad-hoc) to launch at all.
          # This is NOT a Developer ID signature — users still get a Gatekeeper
          # prompt until the app is properly signed + notarized.
          codesign --force --deep --sign - "$app"

          dmg="steelpage-desktop-${GITHUB_REF_NAME}-macos-arm64.dmg"
          stage=dmgstage
          mkdir -p "$stage"
          cp -R "$app" "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname Steelpage -srcfolder "$stage" -ov -format UDZO "$dmg"
          shasum -a 256 "$dmg" > "$dmg.sha256"
          ls -lh "$dmg"

      - name: Package installer (windows)
        if: matrix.name == 'windows-amd64'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $ver = $tag -replace '^v', ''
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (!(Test-Path $makensis)) { choco install nsis -y --no-progress }

          $stage = "nsis-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item steelpage-desktop.exe $stage\
          Copy-Item build\windows\icon.ico $stage\
          Copy-Item build\windows\installer.nsi $stage\

          $out = Join-Path $PWD "steelpage-desktop-$tag-windows-amd64-setup.exe"
          # File/Icon paths in the .nsi are relative to makensis' working dir.
          Push-Location $stage
          & $makensis "/DAPPVERSION=$ver" "/DOUTFILE=$out" installer.nsi
          Pop-Location
          if (!(Test-Path $out)) { throw "NSIS did not produce the installer" }
          (Get-FileHash $out -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $out -Leaf) | Out-File -Encoding ascii "$out.sha256"

      - name: Attach assets to release
        uses: softprops/action-gh-release@v2
        with:
          # Matches the raw archive, the installer, and their .sha256 files for
          # this matrix entry. The first job creates the release; the rest append.
          files: |
            steelpage-desktop-${{ github.ref_name }}-${{ matrix.name }}*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
